name: uytop

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: uytop-app:${APP_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      APP_RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uytop_storage:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    image: uytop-app:${APP_IMAGE_TAG:-latest}
    env_file: .env
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    volumes:
      - uytop_storage:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: uytop-app:${APP_IMAGE_TAG:-latest}
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - uytop_storage:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uytop_storage:
